name: Update Indicadores Ambiente de Negocios

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OBSERVATORIO_TOKEN: ${{ secrets.OBSERVATORIO_TOKEN }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run data pipeline
        run: python -I scripts/run_pipeline.py

      - name: Update dashboard data
        run: python dashboard/update_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet output/ dashboard/ 2>/dev/null; then
            echo "No changes in data"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/ dashboard/
            git commit -m "chore: update indicadores $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
